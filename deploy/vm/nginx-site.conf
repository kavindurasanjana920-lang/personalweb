# Two hosts on one VM.
#
#   thekavindu.lk / www          the portfolio, with the API mounted at /api
#     /              ─▶ Next.js  127.0.0.1:3000
#     /api/contact   ─▶ Next.js  (its own route; must win over the /api/ block)
#     /api/          ─▶ PHP-FPM ─▶ Laravel
#     /up            ─▶ PHP-FPM ─▶ Laravel
#
#   backend.thekavindu.lk        the same Laravel app on its own hostname
#     /              ─▶ PHP-FPM ─▶ Laravel
#
# Mounting the API under the portfolio's own origin is what keeps the browser
# from ever making a cross-origin request, so the site itself needs no CORS.
# backend.thekavindu.lk exists for direct API consumers; CORS_ALLOWED_ORIGINS
# in Laravel's .env governs who may call it from a browser.
#
# Laravel's routes already carry the /api prefix, so under thekavindu.lk the URI
# passes through untouched - no rewriting.
#
# Installed to /etc/nginx/sites-available/thekavindu by deploy/vm/bootstrap.sh.
# certbot --nginx adds the 443 blocks and the redirects; leave those alone.

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# PHP only treats a request as secure when the HTTPS param is non-empty. nginx
# terminates TLS itself once certbot has run, so $scheme is the source of truth.
map $scheme $https_flag {
    default "";
    https   "on";
}

# ---------------------------------------------------------------------------
# API host
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name backend.thekavindu.lk;

    root /var/www/laravel/current/public;
    index index.php;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/backend.access.log;
    error_log  /var/log/nginx/backend.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https_flag if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }
}

# ---------------------------------------------------------------------------
# Portfolio host (also the default, so the bare IP keeps working)
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name thekavindu.lk www.thekavindu.lk;

    root /var/www/laravel/current/public;
    index index.php;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    access_log /var/log/nginx/thekavindu.access.log;
    error_log  /var/log/nginx/thekavindu.error.log;

    # --- Next.js server route ------------------------------------------------
    # Longer prefix than /api/, so this wins. ^~ also stops regex locations from
    # being considered, which keeps the \.php$ block from grabbing it.
    location ^~ /api/contact {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
    }

    # --- Laravel API ---------------------------------------------------------
    location ^~ /api/ {
        try_files $uri @laravel;
    }

    location = /up {
        try_files $uri @laravel;
    }

    location @laravel {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https_flag if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Nothing else may execute PHP, and dotfiles are never served.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # --- Next.js -------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
        # A location-level add_header discards the ones inherited from the server
        # block, so nosniff has to be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Files in public/ are served by Next with "Cache-Control: public, max-age=0",
    # so every logo and photo is revalidated on each page view. Their names are
    # stable across deploys, so a week of caching is safe - but not "immutable",
    # since unlike /_next/static these filenames carry no content hash.
    # The single-segment pattern deliberately cannot match /_next/static or
    # /_next/image, which have their own handling.
    location ~* ^/[^/]+\.(png|jpe?g|webp|avif|gif|svg|ico|woff2?)$ {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
    }
}
