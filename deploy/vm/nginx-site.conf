# Single front door for both apps on the Azure VM.
#
#   /              -> Next.js standalone server on 127.0.0.1:3000
#   /api/contact   -> Next.js (its own server route; must win over the /api/ block)
#   /api/          -> Laravel via PHP-FPM, docroot /var/www/laravel/current/public
#   /up            -> Laravel health endpoint
#
# Serving both apps from one origin means the browser never makes a cross-origin
# request, so CORS never enters the picture. Laravel's routes already carry the
# /api prefix, so nothing needs rewriting - the URI is passed through untouched.
#
# Installed to /etc/nginx/sites-available/thekavindu by deploy/vm/bootstrap.sh.

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# PHP only treats a request as secure when the HTTPS param is non-empty. nginx
# terminates TLS itself once certbot has run, so $scheme is the source of truth.
map $scheme $https_flag {
    default "";
    https   "on";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/laravel/current/public;
    index index.php;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    access_log /var/log/nginx/thekavindu.access.log;
    error_log  /var/log/nginx/thekavindu.error.log;

    # --- Next.js server route ------------------------------------------------
    # Longer prefix than /api/, so this wins. ^~ also stops regex locations from
    # being considered, which keeps the \.php$ block from grabbing it.
    location ^~ /api/contact {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
    }

    # --- Laravel API ---------------------------------------------------------
    location ^~ /api/ {
        try_files $uri @laravel;
    }

    location = /up {
        try_files $uri @laravel;
    }

    location @laravel {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https_flag if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Nothing else may execute PHP, and dotfiles are never served.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # --- Next.js -------------------------------------------------------------
    # Immutable build assets: let the browser cache hard.
    location /_next/static/ {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
        # A location-level add_header discards the ones inherited from the server
        # block, so nosniff has to be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://nextjs;
        include /etc/nginx/snippets/thekavindu-proxy.conf;
    }
}
