# Shared proxy headers for the Next.js upstream.
# Installed to /etc/nginx/snippets/thekavindu-proxy.conf by deploy/vm/bootstrap.sh.

# HTTP/1.1 with an empty Connection header is what keeps the upstream keepalive
# pool in the site config usable. Next needs no websocket upgrade in production.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 60s;
proxy_connect_timeout 10s;
proxy_buffering on;
